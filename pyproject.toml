[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ansible-pb"
dynamic = ["version"]
description = "A terminal console for an Ansible repository: run playbooks, read the inventory, probe hosts, manage vaults."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Theis N. Jensen" }]
keywords = ["ansible", "tui", "textual", "terminal", "infrastructure", "devops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "textual>=6.0",
  "PyYAML>=6",
]

[project.urls]
Homepage = "https://github.com/thei1575/ansible-pb"
Issues = "https://github.com/thei1575/ansible-pb/issues"

[project.scripts]
pb = "pb.app:main"

[tool.hatch.version]
path = "src/pb/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pb"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The nesting in `compose()` is the widget tree. Collapsing a `with TabPane(...)`
# into its child container would save a line and lose the shape.
"src/pb/app.py" = ["SIM117"]
