name: Product request
description: Propose an operator workflow or repository capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        pb covers the path from repository inspection to recorded Ansible run.
        Infrastructure actions use Ansible commands, and commands remain visible
        for review. Describe the operator workflow that needs attention.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        Describe the situation, not the feature. What are you doing today, and
        what makes it slow or risky?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Which tab would it live on? What would you press?

  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: Describe the current command, script, tool, or manual procedure.
