name: Bug report
description: Report an incorrect command, result, or interface state
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report security issues through the private channel in
        [SECURITY.md](https://github.com/thei1575/ansible-pb/blob/main/.github/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what did pb do?
      placeholder: |
        On the Playbooks tab I picked site.yml, set --limit web, and pressed A.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: The command pb built
      description: >
        Copy the line from the right-hand command pane (or the `$ …` line at the
        top of the run screen). If pb built the wrong command, this is usually
        the whole bug. Redact anything sensitive.
      render: shell

  - type: textarea
    id: output
    attributes:
      label: Output or traceback
      description: >
        Any error pb printed, or the relevant part of the Ansible output.
        Run records live in `.pb/runs/` in your repo. **Please redact secrets** -
        Ansible output can contain them.
      render: shell

  - type: input
    id: pb-version
    attributes:
      label: pb version
      description: "`pb --version`"
      placeholder: pb 0.1.0
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Python, Ansible and OS
      description: "`python3 -V`, `ansible --version` (first line), and your OS"
      placeholder: Python 3.13.3 / ansible [core 2.18.1] / macOS 15.6
    validations:
      required: true

  - type: textarea
    id: layout
    attributes:
      label: Anything unusual about your repo layout
      description: >
        pb expects `playbooks/`, `roles/` and `inventories/production/`. If yours
        differs, say how.
