site_name: pb
site_description: >-
  A terminal console for an Ansible repository: run playbooks, read the
  inventory, probe hosts, manage vaults.
site_url: https://thei1575.github.io/ansible-pb/
site_author: Theis N. Jensen

repo_url: https://github.com/thei1575/ansible-pb
repo_name: thei1575/ansible-pb
edit_uri: edit/main/docs/
copyright: MIT licensed

docs_dir: docs
strict: true

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    # Follows the operating system until the reader says otherwise.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

nav:
  - Home: index.md
  - Install: install.md
  - Your repository: repository.md
  - Tabs:
      - Playbooks: tabs/playbooks.md
      - Inventory: tabs/inventory.md
      - Status: tabs/status.md
      - Roles: tabs/roles.md
      - Vault: tabs/vault.md
      - History: tabs/history.md
      - Doctor: tabs/doctor.md
  - Reference:
      - Keys: reference/keys.md
      - Command line: reference/cli.md
  - Security: security.md
  - Development: development.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  # The changelog and the security policy are shipped in the repository root,
  # not written twice. `base_path` reaches out of docs/ to include them.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/thei1575/ansible-pb
      name: pb on GitHub
